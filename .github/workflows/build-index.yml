name: Build guide index

on:
  push:
    branches: [main]
    paths: ['guides/**', 'tools/build_index.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index.json
        run: python tools/build_index.py
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then exit 0; fi
          git config user.name "guide-index-bot"
          git config user.email "guide-index-bot@users.noreply.github.com"
          git add index.json
          git commit -m "Update guide index"
          git push
