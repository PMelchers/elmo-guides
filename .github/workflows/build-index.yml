name: Build guide index

on:
  push:
    branches: [main]
    paths: ['guides/**', 'tools/build_index.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and commit index.json
        run: |
          git config user.name "guide-index-bot"
          git config user.email "guide-index-bot@users.noreply.github.com"
          # several guides can arrive at once: always rebuild on top of the newest main, retry if a push races
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/build_index.py
            if git diff --quiet -- index.json; then exit 0; fi
            git add index.json && git commit -q -m "Update guide index"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
